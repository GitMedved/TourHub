services:
  postgres:
    image: postgres:15-alpine
    container_name: tourhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-travel_aggregator}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tourhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-travel_aggregator}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tourhub_postgres_data:
